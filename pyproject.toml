[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-board"
version = "1.0.0"
description = "AI multi-agent task flow & bulletin board system — deterministic Python scripts for multi-Agent task coordination via file system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "AI Task Board Contributors"}]
keywords = [
    "ai",
    "agent",
    "multi-agent",
    "task-management",
    "task-flow",
    "bulletin-board",
    "coordination",
    "automation",
    "workflow",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/andersyin/ai-task-board"
Repository = "https://github.com/andersyin/ai-task-board"
Issues = "https://github.com/andersyin/ai-task-board/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["board"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
